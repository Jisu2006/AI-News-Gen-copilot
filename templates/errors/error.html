<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - {{ error_title }} | AI-NewsGen Copilot</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-app d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    {% include 'includes/navbar.html' %}

    <!-- Error Content -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                <div class="dashboard-card p-5">
                    <div class="mb-4">
                        <span class="auth-icon d-inline-flex align-items-center justify-content-center rounded-circle bg-app border-app p-4">
                            <i class="bi {{ error_icon or 'bi-exclamation-triangle' }} text-accent display-4"></i>
                        </span>
                    </div>

                    <h1 class="display-3 fw-bold text-accent mb-2">{{ error_code }}</h1>
                    <h2 class="h4 mb-3">{{ error_title }}</h2>
                    <p class="text-secondary-app mb-4">
                        {{ error_description }}
                    </p>

                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a href="{{ url_for('news.homepage') }}" class="btn primary-btn px-4 py-2">
                            <i class="bi bi-house-door me-1"></i> Return Home
                        </a>
                        <button onclick="window.history.back()" class="btn secondary-btn px-4 py-2">
                            <i class="bi bi-arrow-left me-1"></i> Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer mt-auto py-3">
        <div class="container text-center">
            <p class="app-footer-text mb-0">© 2026 AI-NewsGen Copilot • All Rights Reserved</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
