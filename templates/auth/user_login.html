<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - AI NewsGen</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="text-center mb-2">
                        📰 AI NewsGen
                    </h2>

                    <p class="text-center text-muted mb-4">
                        User Login
                    </p>


                    <!-- Flash Messages -->

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert
                                    {% if category == 'success' %}
                                        alert-success
                                    {% else %}
                                        alert-danger
                                    {% endif %}
                                    "
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- Login Form -->

                    <form
                        method="POST"
                        action="{{ url_for('auth.user_login') }}"
                    >

                        <!-- CSRF Protection -->
                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >


                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <div class="text-center mt-3">

                        <p class="mb-1">
                            Don't have an account?
                        </p>

                        <a
                            href="{{ url_for('auth.register') }}"
                            class="text-decoration-none"
                        >
                            Create User Account
                        </a>

                    </div>


                    <hr>


                    <div class="text-center">

                        <small class="text-muted">
                            Administrator?
                        </small>

                        <br>

                        <a
                            href="{{ url_for('auth.admin_login') }}"
                            class="text-decoration-none"
                        >
                            Admin Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
